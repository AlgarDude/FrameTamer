# Pushing a tag v<version> builds the DLL and publishes a release zip holding a FrameTamer folder.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild src/FrameTamer.sln -p:Configuration=Release -p:Platform=x86

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package/FrameTamer/libs | Out-Null
          Copy-Item FrameTamer.lua, README.md, LICENSE package/FrameTamer/
          Copy-Item libs/_frametamer.dll package/FrameTamer/libs/
          Compress-Archive package/FrameTamer FrameTamer-${{ github.ref_name }}.zip

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} FrameTamer-${{ github.ref_name }}.zip --generate-notes
